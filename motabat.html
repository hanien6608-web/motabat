<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة متابعة الطلاب - EG Academies</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1f5c;--gold:#d99c00;--cream:#fffde7;--blue:#4a3df5;--red:#e8123c;--green:#0aa56a;--orange:#f59e0b;--purple:#d946ef;--bg:#fff}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--navy)}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:22px}header small{color:#f5b50a}
header .r{font-size:15px}header .l b{font-size:30px}
.wrap{padding:12px;display:grid;gap:12px;max-width:1300px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.box{background:var(--cream);border:2px solid var(--gold);border-radius:20px;padding:12px}
.card{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:18px}
.num{color:#fff;border-radius:12px;padding:2px 14px;font-size:34px;font-weight:900}
.mid{display:grid;grid-template-columns:1.1fr 1fr 1.2fr .7fr;gap:12px}
.bot{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
h2{margin:0 0 8px;font-size:22px;font-weight:900}
.fun div{margin:6px auto;color:#fff;font-weight:700;text-align:center;padding:4px;border-radius:4px;white-space:nowrap;cursor:default}
select,input{width:100%;font-family:inherit;background:var(--navy);color:#fff;border:0;border-radius:4px;padding:6px;font-weight:700;margin-bottom:8px}
label{display:block;color:var(--gold);font-weight:900;text-align:center;font-size:18px}
input{background:#fff;color:var(--navy);border:1px solid var(--gold)}
.tw{max-height:300px;overflow:auto;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--cream);border:1px solid var(--gold);padding:6px;color:var(--navy)}
td{border:1px solid var(--gold);padding:5px;text-align:center}
td.n{color:var(--blue);font-weight:700}td.nr{color:var(--red);font-weight:700}
svg text{font-family:Cairo,Tahoma,sans-serif;direction:ltr}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:15px;font-weight:700;justify-content:center;margin-top:8px}.leg.big{font-size:14px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-inline-start:6px;vertical-align:-2px}button{width:100%;font-family:inherit;font-weight:900;font-size:16px;background:var(--gold);color:#fff;border:0;border-radius:8px;padding:8px;cursor:pointer}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.mid,.bot{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff}}
</style></head><body>
<header><div class="r"><h1>لوحة متابعة الطلاب وطلبات الالتحاق</h1><small>منصة تسجيل المعاهد والأكاديميات الخاصة</small></div>
<div class="l"><b dir="ltr">EG Academies</b><br><small>بوابة المعاهد والأكاديميات الخاصة في مصر</small></div></header>

)","gov":"سوهاج","spec":"غير متوفر","st":"رفض / غير مهتم / انسحب","emp":"مريم صابر","src":"—"},{"id":475,"name":"هالة محمد محمود","qual":"ثانوي أزهري (غير محدد)","gov":"الوادي الجديد","spec":"النظم والإدارة والعلاقات العامة","st":"مهتم / جاري المتابعة","emp":"مريم صابر","src":"—"},{"id":476,"name":"نهلة محمد احمد محمد","qual":"ثانوي عام (غير محدد)","gov":"أسيوط","spec":"تمريض","st":"لم يتم الرد","emp":"مريم صابر","src":"—"}];
const NA='غير متوفر';
const G={'مهتم / جاري المتابعة':'i','تم التواصل الأولي':'i','لم يتم الرد':'n','رفض / غير مهتم / انسحب':'n','تم التسجيل / تقديم الاستمارة':'r','حالات أخرى (تحتاج مراجعة)':'v'};
const C={i:'#4a3df5',n:'#e8123c',r:'#0aa56a',v:'#f59e0b'},L={i:'مهتم/متابعة',n:'غير مهتم',r:'مسجل',v:'مراجعة'};
const F={emp:'الموظف',gov:'المحافظة',spec:'التخصص',qual:'المؤهل'},sel={};
const $=id=>document.getElementById(id);
const cnt=(a,k)=>{const m={};a.forEach(x=>{if(x[k]!==NA)m[x[k]]=(m[x[k]]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
function filt(){const q=$('q').value.trim();return D.filter(x=>Object.keys(sel).every(k=>!sel[k]||x[k]===sel[k])&&(!q||x.name.includes(q)))}
function init(){$('filters').innerHTML=Object.keys(F).map(k=>`<label>${F[k]}</label><select data-k="${k}"><option value="">الكل</option>${cnt(D,k).map(e=>`<option>${e[0]}</option>`).join('')}</select>`).join('')+'<button id="clr">مسح الفلاتر</button>';
$('clr').onclick=()=>{Object.keys(sel).forEach(k=>delete sel[k]);document.querySelectorAll('select').forEach(s=>s.value='');$('q').value='';draw()};
document.querySelectorAll('select').forEach(s=>s.onchange=()=>{sel[s.dataset.k]=s.value;draw()});$('q').oninput=draw;draw()}
function draw(){const d=filt(),g={i:0,n:0,r:0,v:0};d.forEach(x=>g[G[x.st]]++);
$('cards').innerHTML=[['اجمالي الطلاب',d.length,'#0d1f5c'],['عدد الاستمارات',g.r,'#0aa56a'],['غير مهتم',g.n,'#e8123c'],['يحتاج مراجعة',g.v,'#f59e0b'],['مهتم وجاري المتابعة',g.i,'#4a3df5']].map(c=>`<div class="box card"><span>${c[0]}</span><span class="num" style="background:${c[2]}">${c[1]}</span></div>`).join('');
const sp=cnt(d,'spec').filter(e=>!e[0].includes('مستفسر')&&!e[0].includes('لم يُذكر')).slice(0,6),cols=['#e8123c','#0aa56a','#ffcc80','#3b9dff','#f59e0b','#d946ef'],mx=sp[0]?sp[0][1]:1;
$('fun').innerHTML=sp.map((e,i)=>`<div title="${e[1]}" style="width:${50+50*e[1]/mx}%;background:${cols[i]};color:${i==2?'#0d1f5c':'#fff'}">${e[0]} (${e[1]})</div>`).join('');
const q=cnt(d,'qual'),qt=q.reduce((a,e)=>a+e[1],0),qc=['#4a3df5','#e8123c','#0d1f5c','#3b9dff','#f59e0b','#0aa56a','#d946ef','#999','#c60','#6aa'];$('qt').textContent='';
let a=-Math.PI/2,s='';q.forEach((e,i)=>{const t=e[1]/qt*2*Math.PI,r=95,x1=150+r*Math.cos(a),y1=120+r*Math.sin(a),x2=150+r*Math.cos(a+t-.001),y2=120+r*Math.sin(a+t-.001);s+=`<path d="M${x1} ${y1}A${r} ${r} 0 ${t>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${qc[i%10]}" stroke-width="26"><title>${e[0]}: ${e[1]}</title></path>`;a+=t});
s+=`<text x="150" y="115" text-anchor="middle" font-size="24" font-weight="900" fill="#0d1f5c">المؤهلات</text><text x="150" y="145" text-anchor="middle" font-size="26" font-weight="900" fill="#d99c00">${qt}</text>`;
$('donut').innerHTML=s;$('dleg').innerHTML=q.map((e,i)=>`<span><i style="background:${qc[i%10]}"></i>${e[0]} (${e[1]})</span>`).join('');
const gv=cnt(d,'gov').slice(0,10),gm=gv[0]?gv[0][1]:1;
$('gov').innerHTML=gv.map((e,i)=>{const h=Math.max(4,170*e[1]/gm),x=48+i*34,y=215-h;return `<rect x="${x}" y="${y}" width="26" height="${h}" rx="3" fill="#d99c00"><title>${e[0]}: ${e[1]}</title></rect><text x="${x+13}" y="${y-4}" text-anchor="middle" font-size="16" font-weight="900" fill="#0d1f5c">${e[1]}</text><text transform="translate(${x+19},232) rotate(-50)" text-anchor="end" font-size="17" font-weight="700" fill="#0d1f5c">${e[0]}</text>`}).join('');
const em=cnt(d,'emp').slice(0,8),em2=em.map(e=>{const o={i:0,n:0,r:0,v:0};d.filter(x=>x.emp===e[0]).forEach(x=>o[G[x.st]]++);return[e[0],o,e[1]]}),em_m=em2[0]?em2[0][2]:1;
$('emp').innerHTML=em2.map((e,i)=>{let y=200,x=62+i*42,s='';['r','i','v','n'].forEach(k=>{const h=180*e[1][k]/em_m;y-=h;s+=`<rect x="${x}" y="${y}" width="30" height="${h}" fill="${C[k]}"><title>${L[k]}: ${e[1][k]}</title></rect>`});return s+`<text x="${x+15}" y="${y-4}" text-anchor="middle" font-size="16" font-weight="700" fill="#0d1f5c">${e[2]}</text><text transform="translate(${x+19},216) rotate(-45)" text-anchor="end" font-size="16" fill="#0d1f5c">${e[0]}</text>`}).join('');
$('leg').innerHTML=Object.keys(L).map(k=>`<span><i style="background:${C[k]}"></i>${L[k]}</span>`).join('');
$('tb').innerHTML=d.map(x=>`<tr><td>${x.id}</td><td>${x.emp}</td><td>${x.spec}</td><td>${x.gov}</td><td class="${G[x.st]=='n'?'nr':'n'}">${x.name}</td><td>${x.st}</td><td>${x.src}</td></tr>`).join('')}
init();
</script></body></html>
